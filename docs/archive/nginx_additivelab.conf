server {
    server_name additivelab.online www.additivelab.online;
    root /var/www/additivelab.online;
    index index.html;

    # Gzip compression for faster loading of large WASM files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    location / {
        try_files $uri $uri/ =404;

        # CRITICAL HEADERS for WASM/SharedArrayBuffer stability
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Correct MIME type for WASM
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
