  stock_assumption: null  # bar | plate | near_net — illustrative
  primary_datum_hypothesis: null
  tolerance_notes: []  # list of provisional notes; not substitution for drawings

route_hints_experimental:
  # Non-authoritative sequence suggestions for human review
  suggested_steps: []

