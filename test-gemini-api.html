<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Gemini API</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Тест Google Gemini API</h1>
    <button onclick="testAPI()">Тестировать API</button>
    <div id="result"></div>

    <script>
        const API_KEY = 'AIzaSyBJRWlXo9iTXXN0Qn3HoKxQF5WLwU-pNJQ';
        const MODELS = [
            'gemini-1.5-flash',
            'gemini-1.5-pro',
            'gemini-pro',
            'gemini-1.0-pro'
        ];

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Тестирование моделей...</p>';

            for (const model of MODELS) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
                
                try {
                    resultDiv.innerHTML += `<p>Проверка модели: <strong>${model}</strong>...</p>`;
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: 'Привет! Ответь коротко: работает ли эта модель?'
                                }]
                            }]
                        })
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        resultDiv.innerHTML += `<p class="success">✅ Модель ${model} РАБОТАЕТ!</p>`;
                        resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                        break; // Нашли рабочую модель
                    } else {
                        resultDiv.innerHTML += `<p class="error">❌ Модель ${model} не работает: ${data.error?.message || 'Неизвестная ошибка'}</p>`;
                    }
                } catch (error) {
                    resultDiv.innerHTML += `<p class="error">❌ Ошибка при проверке ${model}: ${error.message}</p>`;
                }
            }
        }
    </script>
</body>
</html>
