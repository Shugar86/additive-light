version: '3.8'

services:
  # Redis - Message broker for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API - FastAPI
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - uploads:/app/uploads
      - runs:/app/runs
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker - Background tasks
  worker:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - uploads:/app/uploads
      - runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock  # For spawning sandbox containers
    depends_on:
      - redis
      - api
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=sensor,synthesis,judge

  # Sandbox Container - Isolated code execution
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    # This service is not started automatically, only used as image
    # Workers spawn sandbox containers as needed
    image: gdi-sandbox
    deploy:
      replicas: 0

  # Frontend - React (development)
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm start

  # MinIO - S3-compatible object storage (optional, for production)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  redis_data:
  uploads:
  runs:
  minio_data:
